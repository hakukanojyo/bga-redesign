# 推進 main（release PR 合併）時，打包並部署到 GitHub Pages（docs/adr/0019）
# 網址：https://hakukanojyo.github.io/bga-redesign/
name: Deploy

on:
  push:
    branches: [main]
  # 也可以在 Actions 頁面手動重新部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 一次只部署一個；新的推上來時不中斷正在部署的，避免網站停在一半
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub Pages 找不到檔案時回傳 404.html：複製一份 index.html，直接開內頁網址時 Vue Router 接手
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
